<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="woliul-hasan-bUbk6ge6Ze0-unsplash.jpg">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h2>Currency converter</h2>

      <div class="form">
        <div class="amount">
          <p>Enter amaount</p>
          <input value="100" type="number" />
        </div>

        <div class="dropdowns">
          <div class="from">
            <p>From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/shiny/64.png" alt="" />
              <select name="from" id="">
              </select>
            </div>
          </div>

          <i class="fa-solid fa-arrow-right-arrow-left"></i>

          <div class="to">
            <p>To</p>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/shiny/64.png" alt="" />
              <select name="to" id="">
              </select>
            </div>
          </div>
        </div>
        <div class="msg">1 USD = 95.21 INR</div>
        <button>Get Exchange Rate</button>
      </div>
    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
